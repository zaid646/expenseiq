[project]
name = "expenseiq-ai-service"
version = "0.1.0"
description = "ExpenseIQ AI service — receipt extraction, GL coding, policy checks"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "openai>=1.40",
    "tenacity>=9.0",
    "python-dotenv>=1.0",
    "langfuse>=3.0",
    "psycopg[binary]>=3.2",
    "prometheus-client>=0.20",
    "pymongo>=4.8",
    "opensearch-py>=2.7",
    "pyyaml>=6.0",
    "rich>=13.7",
    # entity graph + GraphQL API
    "neo4j>=5.20",
    "strawberry-graphql[fastapi]>=0.235",
    # clustering / community detection
    "networkx>=3.3",
    "scikit-learn>=1.5",
    # durable workflow checkpoints / leases
    "redis>=5.0",
]

[project.optional-dependencies]
# semantic vectors for OpenSearch hybrid retrieval (falls back to hashing)
search = [
    "fastembed>=0.3",
]
# Ray distributed ingestion benchmark (CI runs a small local-mode job)
bench = [
    "ray[default]>=2.40,<3",
]
# notebooks / evals / datasets (Phase 1)
evals = [
    "datasets>=2.20",
    "huggingface-hub>=0.24",
    "wandb>=0.17",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "pydantic>=2.8",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.23",
    "fakeredis>=2.23",
    "ruff>=0.6",
    "jupyter>=1.1",
    "ipykernel>=6.29",
    "nbconvert>=7.16",
    "papermill>=2.6",
    "datasets>=2.20",
    "huggingface-hub>=0.24",
    "wandb>=0.17",
    "pandas>=2.2",
    "matplotlib>=3.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
